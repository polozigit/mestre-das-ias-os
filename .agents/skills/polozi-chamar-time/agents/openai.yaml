interface:
  display_name: "Polozi Chamar Time"
  short_description: "Confere o time de área instalado e segue a skill dele na conversa, sem subagente."
  default_prompt: "Use $polozi-chamar-time para chamar o time de [área] na minha Empresa IA."
policy:
  # false: disparo implícito em qualquer frase com "time" faria a IA seguir
  # skill de time sem o aluno pedir. Consistente com as outras skills da
  # fundação (todas false hoje).
  allow_implicit_invocation: false
