# Lista antiga de excecoes as guardas de arquitetura (GA-01..GA-17, ADR-012).
# Cada item: guarda, objeto, dono, adr. SO DIMINUI: item novo sem `adr` que
# exista em adrs.yml reprova (GA-13, tests/test_arquitetura.py). O espelho desta
# lista esta em tests/000_arquitetura.sql (tabela temporaria _exc); o teste
# confere que os dois batem.
excecoes:
  - guarda: GA-07
    objeto: public.empresa.nome
    dono: Lider de Dados
    adr: ADR-001
    motivo: nome da EMPRESA (pessoa juridica do dono), nao de pessoa natural
  - guarda: GA-07
    objeto: public.modulo.nome
    dono: Lider de Dados
    adr: ADR-012
    motivo: nome de exibicao de modulo do sistema, nao de pessoa
