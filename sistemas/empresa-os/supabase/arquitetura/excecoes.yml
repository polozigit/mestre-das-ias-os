    objeto: fk_plano_atividade_agente
    dono: Integrador
    adr: ADR-013
    motivo: agente padrao da atividade do modelo de plano aponta public.agentes (nucleo)
  - guarda: GA-05
    objeto: fk_plano_instancia_dono
    dono: Integrador
    adr: ADR-013
    motivo: dono do plano aponta public.usuarios (nucleo)
  - guarda: GA-05
    objeto: fk_plano_instancia_parte
