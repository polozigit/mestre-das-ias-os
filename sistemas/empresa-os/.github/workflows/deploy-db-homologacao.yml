# Aplica migrations + dado de exemplo no projeto de HOMOLOGACAO (nunca no de
# producao). Roda em PR que toca migration ou seed e sob demanda. A homologacao
# existe pra o preview da Vercel e pra provar a migration com dado antes da
# main: producao so recebe pelo deploy-db.yml, sem seed (E3-12, ADR-003).
#
# Workflow SEPARADO do deploy-db.yml de proposito: nao mexe na guarda dos 3
# secrets de producao. Usa o MESMO SUPABASE_ACCESS_TOKEN (e da conta) e o par
# *_HOMOLOG. SUPABASE_PROJECT_ID (producao) entra SO pra comparar: o passo
# abaixo derruba o job se a homologacao estiver vazia ou for igual a producao.
#
# Este e o deploy-db.yml sao os UNICOS workflows do kit (decisao 26/10/2026):
# lint, tsc, testes, banco local e varredura de segredo rodam no computador do
# dono, pela skill tecnologia-publicar (checar_local.py), antes do merge. Assim
# a cota gratis do GitHub Actions (2.000 min/mes em repositorio privado) so
# gasta quando uma migration chega no banco, cerca de 1 minuto por vez.
name: deploy-db-homologacao

on:
  pull_request:
    paths:
      - "sistemas/empresa-os/supabase/migrations/**"
      - "sistemas/empresa-os/supabase/seed_exemplo.sql"
  workflow_dispatch:

permissions:
  contents: read

# DESVIO DELIBERADO do padrão dos outros workflows: cancel-in-progress FALSE,
# pelo mesmo motivo do deploy-db.yml. Cancelar um `db push` no meio deixa o
# schema pela metade — pior do que esperar a fila.
concurrency:
  group: deploy-db-homologacao
  cancel-in-progress: false

defaults:
  run:
    working-directory: sistemas/empresa-os

jobs:
  # Fecha a lacuna do hook de commit da Casa, que dá pra contornar: a migration
  # só chega na homologação se cada migration nova ou alterada da PR tem
  # veredito APPROVED, com o mesmo sha do arquivo e, se destrutiva, com o "sim"
  # do dono (veredito.py conferir).
  vereditos:
    name: toda migration da PR tem veredito
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # O veredito mora na raiz da Casa (operacao/vereditos), não em
    # sistemas/empresa-os: este job roda da raiz.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: confere o veredito de cada migration nova ou alterada
        env:
          # Vem por env, nunca por ${{ }} dentro do script: o nome da branch
          # não pode virar comando.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          VER=.agents/skills/tecnologia-mudar-banco/scripts/veredito.py
          if [ ! -f "$VER" ]; then
            echo "Falta $VER: o time tecnologia nao esta instalado nesta Casa."
            exit 1
          fi
          if [ -z "$BASE_REF" ]; then
            echo "Execucao manual: nao ha PR, nada a conferir."
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          # --no-renames: migration renomeada sai como A (nome novo) e e conferida.
          lista=$(git diff --name-only --no-renames --diff-filter=ACM "origin/$BASE_REF...HEAD" -- 'sistemas/*/supabase/migrations/*.sql')
          if [ -z "$lista" ]; then
            echo "Nenhuma migration na PR."
            exit 0
          fi
          falhou=0
          for f in $lista; do
            echo "conferindo: $f"
            python3 "$VER" conferir "$f" || falhou=1
          done
          if [ "$falhou" != "0" ]; then
            echo "Ha migration sem veredito valido (motivos acima)."
            exit 1
          fi

  homologar:
    name: aplica migrations e dado de exemplo na homologação
    needs: vereditos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: homologacao
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_HOMOLOG }}
      SUPABASE_PROJECT_ID_HOMOLOG: ${{ secrets.SUPABASE_PROJECT_ID_HOMOLOG }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: confere que a homologação não é a produção
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_PROJECT_ID_HOMOLOG" ]; then
            echo "SUPABASE_PROJECT_ID_HOMOLOG vazio: o projeto de homologação não foi cadastrado."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_ID_HOMOLOG" = "$SUPABASE_PROJECT_ID" ]; then
            echo "A homologação aponta para o mesmo projeto da produção. Corrija o secret SUPABASE_PROJECT_ID_HOMOLOG."
            exit 1
          fi
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID_HOMOLOG"
      - run: supabase db push --include-seed
